aid: glasspoint
name: GlassPoint
description: 'GlassPoint is an industrial solar process heat company founded in 2009
  that designs, builds, owns and operates enclosed-trough solar thermal systems delivering
  steam to industrial customers under a Steam-as-a-Service model. Its enclosed trough
  places mirrors inside a glasshouse to cut capital cost and wind loading, and it has
  delivered commercial solar process steam since the Amal project in Oman went online
  in 2012, followed by Miraah and the Ma''aden Solar I project in Saudi Arabia. The
  company sells decarbonized industrial heat and energy plants, not software: it operates
  a marketing and press site at glasspoint.com and publishes no developer program,
  API, SDK, or machine-readable specification of any kind.'
